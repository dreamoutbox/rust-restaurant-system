[package]
name = "rust-restaurant-system"
version = "0.1.0"
edition = "2024"
default-run = "rust-restaurant-system"
description = "A full-stack, real-time restaurant management system built with Rust (Axum) and Vue 3."
license = "MIT"
repository = "https://github.com/dreamoutbox/rust-restaurant-system"
homepage = "https://github.com/dreamoutbox/rust-restaurant-system"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }

sqlx = { version = "0.8", features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "uuid",
    "chrono",
    "rust_decimal",
] }

jsonwebtoken = "9"
argon2 = "0.5"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
qrcode = "0.14"
image = { version = "0.25", default-features = false, features = ["png"] }
rust_decimal = { version = "1", features = ["serde-with-str"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

async-trait = "0.1"
futures-util = "0.3.33"
tokio-stream = { version = "0.1.19", features = ["sync"] }
